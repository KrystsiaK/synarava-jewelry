# Keep staging current when main moves (hotfix / direct land on main).
# Day-to-day work ships to staging first, then opens a PR into main.
# Promote with a merge commit (not squash) so this job can fast-forward.
name: Sync main → staging

on:
  push:
    branches:
      - main

concurrency:
  group: sync-main-to-staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Fast-forward staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward staging to main
        run: |
          set -euo pipefail
          git fetch origin main staging
          git checkout staging
          if git merge --ff-only origin/main; then
            git push origin staging
            exit 0
          fi
          echo "::error::Cannot fast-forward staging to main (diverged history)."
          echo "Usually caused by squash-merging staging→main."
          echo "Fix: merge commit next time; for now reset staging to main when trees match:"
          echo "  git checkout staging && git reset --hard origin/main && git push --force-with-lease origin staging"
          exit 1
