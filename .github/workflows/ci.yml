name: CI

on:
  pull_request:
  push:
    # Feature/bot branches are covered by pull_request only — avoid double runs.
    branches:
      - main
      - staging
    tags:
      - "v*"

concurrency:
  # PRs: one in-flight run per PR (cancel superseded).
  # Pushes/tags: per-commit group so a newer push cannot cancel an older queued run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      shop: ${{ steps.filter.outputs.shop }}
      sku: ${{ steps.filter.outputs.sku }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shop:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - '!lib/sku/**'
              - 'prisma/**'
              - 'e2e/**'
              - 'public/**'
              - 'deploy/railway.synarava-web.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'next.config.*'
              - 'vitest.config.*'
              - 'vitest.setup.ts'
              # Workflow-only PRs still need smoke (Playwright cache/install).
              - '.github/workflows/ci.yml'
            sku:
              - 'services/sku-api/**'
              - 'packages/sku-core/**'
              - 'packages/sku-contract/**'
              - 'lib/sku/**'
              - '.railway/**'
              - 'deploy/n8n/**'
              - 'docs/adr/0004-portable-sku-service-boundary.md'
              - 'docs/proposals/portable-sku-service.md'
              - 'docs/runbooks/sku-*.md'
              - 'docs/runbooks/portable-sku-platform-railway.md'
              - 'docs/runbooks/portable-sku-platform-production.md'
              - 'docs/wiki/portable-sku-service.md'
              - 'docs/wiki/portable-sku-current-status.md'
              - 'docs/testing/portable-sku-staging-matrix.md'
              - 'scripts/sku-platform-*-adopt-check.sh'
              - 'scripts/sku-platform-production-plan-check.sh'
              - 'scripts/lib/railway-*.mjs'

  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # A handful of unit-test files (lib/i18n/__tests__/*-save-integration.test.ts)
      # exercise the real save actions against a real Postgres instance instead of
      # mocking @/lib/db, so `pnpm test:run` needs a reachable database here too —
      # not just in the storefront-smoke job below.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synarava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synarava_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synarava_ci
      APP_URL: http://localhost:3000
      # GitHub Packages (@synarava/wiring-engine, shell-kit). See deploy.md.
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Auth GitHub Packages (@synarava)
        run: node scripts/ensure-github-packages-auth.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        run: pnpm check:version

      # Persist Next compile cache + ESLint file cache across runs.
      # Next: https://nextjs.org/docs/app/guides/ci-build-caching
      - name: Cache Next.js and ESLint
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
            ${{ github.workspace }}/.eslintcache
          key: ${{ runner.os }}-qg-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*.{js,jsx,ts,tsx,mjs}', 'components/**/*.{js,jsx,ts,tsx}', 'lib/**/*.{js,jsx,ts,tsx}', 'eslint.config.*', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-qg-cache-${{ hashFiles('pnpm-lock.yaml') }}-

      # Typecheck and lint are independent — overlap to cut serial wall time.
      - name: Typecheck and lint
        run: |
          set -euo pipefail
          pnpm exec tsc --noEmit &
          tsc_pid=$!
          pnpm exec eslint . --cache --cache-location .eslintcache &
          lint_pid=$!
          tsc_ec=0
          lint_ec=0
          wait "$tsc_pid" || tsc_ec=$?
          wait "$lint_pid" || lint_ec=$?
          if [ "$tsc_ec" -ne 0 ] || [ "$lint_ec" -ne 0 ]; then
            echo "typecheck exit=${tsc_ec} lint exit=${lint_ec}" >&2
            exit 1
          fi

      - name: Dependency security audit
        run: pnpm audit --audit-level high --prod

      - name: Push database schema
        run: pnpm prisma:push

      - name: Unit tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  storefront-smoke:
    name: Storefront smoke (desktop and mobile)
    needs: changes
    # Skip heavy smoke when the diff is sku/docs-only; always run on tag pushes.
    if: ${{ needs.changes.outputs.shop == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Pin to @playwright/test in package.json/lockfile. Browsers + OS deps are
    # preinstalled — no apt / --with-deps (avoids intermittent dpkg lock / exit 137).
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
      options: --ipc=host
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synarava_ci
        # Job container ↔ service network alias; ports map is for host jobs only.
        options: >-
          --health-cmd "pg_isready -U postgres -d synarava_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      # db-guard requires localhost/127.0.0.1; job containers reach services via
      # hostname only, so we TCP-forward 127.0.0.1:5432 → postgres:5432 below.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/synarava_ci
      APP_URL: http://localhost:3000
      # Image ships browsers under /ms-playwright (HOME is /github/home in-container).
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/ensure-github-packages-auth.mjs
      - run: pnpm install --frozen-lockfile

      # Share Next compile cache with Quality Gates (same key family).
      # https://nextjs.org/docs/app/guides/ci-build-caching
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
            ${{ github.workspace }}/.eslintcache
          key: ${{ runner.os }}-qg-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**/*.{js,jsx,ts,tsx,mjs}', 'components/**/*.{js,jsx,ts,tsx}', 'lib/**/*.{js,jsx,ts,tsx}', 'eslint.config.*', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-qg-cache-${{ hashFiles('pnpm-lock.yaml') }}-

      # Job containers default to `sh` (no pipefail). Keep the TCP forward in the
      # same bash step as prisma/build/smoke so it is not killed between steps.
      # db-guard requires 127.0.0.1; services are only reachable as hostname `postgres`.
      - name: Schema, build, and storefront smoke
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pg-fwd.mjs <<'EOF'
          import net from "node:net";
          const server = net.createServer((client) => {
            const upstream = net.connect(5432, "postgres");
            client.pipe(upstream);
            upstream.pipe(client);
            const close = () => {
              client.destroy();
              upstream.destroy();
            };
            client.on("error", close);
            upstream.on("error", close);
          });
          server.listen(5432, "127.0.0.1");
          EOF
          node /tmp/pg-fwd.mjs &
          fwd_pid=$!
          trap 'kill "$fwd_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if node -e 'const n=require("node:net");const s=n.connect({host:"127.0.0.1",port:5432},()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1))'; then
              echo "Postgres forward ready on 127.0.0.1:5432 (pid ${fwd_pid})"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "Timed out waiting for 127.0.0.1:5432 forward" >&2
              exit 1
            fi
            sleep 0.25
          done
          pnpm prisma:push
          # Build before smoke so Playwright starts `next start` (fast, deterministic)
          # instead of cold `next dev`, which often exceeds the 120s webServer timeout on GHA.
          pnpm build
          pnpm exec playwright test e2e/smoke.spec.ts --project=chromium --project=mobile-webkit-smoke
