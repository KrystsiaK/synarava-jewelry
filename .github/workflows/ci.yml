name: CI

on:
  pull_request:
  push:
    # Feature/bot branches are covered by pull_request only — avoid double runs.
    branches:
      - main
      - staging
    tags:
      - "v*"

concurrency:
  # PRs: one in-flight run per PR (cancel superseded).
  # Pushes/tags: per-commit group so a newer push cannot cancel an older queued run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    outputs:
      shop: ${{ steps.filter.outputs.shop }}
      sku: ${{ steps.filter.outputs.sku }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shop:
              - 'app/**'
              - 'components/**'
              - 'lib/**'
              - '!lib/sku/**'
              - 'prisma/**'
              - 'e2e/**'
              - 'public/**'
              - 'deploy/railway.synarava-web.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'next.config.*'
              - 'vitest.config.*'
              - 'vitest.setup.ts'
              # Workflow-only PRs still need smoke (Playwright cache/install).
              - '.github/workflows/ci.yml'
            sku:
              - 'services/sku-api/**'
              - 'packages/sku-core/**'
              - 'packages/sku-contract/**'
              - 'lib/sku/**'
              - '.railway/**'
              - 'deploy/n8n/**'
              - 'docs/adr/0004-portable-sku-service-boundary.md'
              - 'docs/proposals/portable-sku-service.md'
              - 'docs/runbooks/sku-*.md'
              - 'docs/runbooks/portable-sku-platform-railway.md'
              - 'docs/runbooks/portable-sku-platform-production.md'
              - 'docs/wiki/portable-sku-service.md'
              - 'docs/wiki/portable-sku-current-status.md'
              - 'docs/testing/portable-sku-staging-matrix.md'
              - 'scripts/sku-platform-*-adopt-check.sh'
              - 'scripts/sku-platform-production-plan-check.sh'
              - 'scripts/lib/railway-*.mjs'

  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # A handful of unit-test files (lib/i18n/__tests__/*-save-integration.test.ts)
      # exercise the real save actions against a real Postgres instance instead of
      # mocking @/lib/db, so `pnpm test:run` needs a reachable database here too —
      # not just in the storefront-smoke job below.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synarava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synarava_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synarava_ci
      APP_URL: http://localhost:3000
      # GitHub Packages (@synarava/wiring-engine, shell-kit). See deploy.md.
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Auth GitHub Packages (@synarava)
        run: node scripts/ensure-github-packages-auth.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        run: pnpm check:version

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Dependency security audit
        run: pnpm audit --audit-level high --prod

      - name: Push database schema
        run: pnpm prisma:push

      - name: Unit tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  storefront-smoke:
    name: Storefront smoke (desktop and mobile)
    needs: changes
    # Skip heavy smoke when the diff is sku/docs-only; always run on tag pushes.
    if: ${{ needs.changes.outputs.shop == 'true' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synarava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synarava_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synarava_ci
      APP_URL: http://localhost:3000
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: node scripts/ensure-github-packages-auth.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:push

      # Build before smoke so Playwright starts `next start` (fast, deterministic)
      # instead of cold `next dev`, which often exceeds the 120s webServer timeout on GHA.
      - run: pnpm build

      # Cache browser binaries; hang-prone install is retried with a hard per-attempt timeout.
      # Always --with-deps: OS libs (e.g. libwoff2dec for webkit) are not in the browser cache.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: |
          set -euo pipefail
          # After timeout/OOM kills (exit 137), apt-get may still hold dpkg locks.
          # Wait for locks to clear before retrying; never race a second --with-deps.
          wait_for_dpkg_lock() {
            local waited=0
            local max_wait=120
            while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 \
              || sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 \
              || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
              if [ "$waited" -ge "$max_wait" ]; then
                echo "dpkg/apt lock still held after ${max_wait}s — killing leftover apt/dpkg"
                sudo killall -q apt-get apt dpkg || true
                sleep 5
                sudo dpkg --configure -a || true
                return 0
              fi
              echo "Waiting for dpkg/apt lock… (${waited}s)"
              sleep 5
              waited=$((waited + 5))
            done
          }
          attempt=1
          max_attempts=3
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Playwright install attempt ${attempt}/${max_attempts}"
            wait_for_dpkg_lock
            status=0
            # Capture non-zero in || so a failed command does not leave status stuck at 0.
            # -k 30: SIGKILL if the child ignores SIGTERM after the 300s budget.
            timeout -k 30 300 pnpm exec playwright install --with-deps chromium webkit || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            # timeout(1) exits 124 on deadline; 137 = SIGKILL (OOM/timeout -k)
            echo "Playwright install attempt ${attempt} failed (exit ${status})"
            if [ "$attempt" -eq "$max_attempts" ]; then
              exit "$status"
            fi
            attempt=$((attempt + 1))
            sleep 10
          done

      - run: pnpm exec playwright test e2e/smoke.spec.ts --project=chromium --project=mobile-webkit-smoke
