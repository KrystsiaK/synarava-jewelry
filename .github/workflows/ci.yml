name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # A handful of unit-test files (lib/i18n/__tests__/*-save-integration.test.ts)
      # exercise the real save actions against a real Postgres instance instead of
      # mocking @/lib/db, so `pnpm test:run` needs a reachable database here too —
      # not just in the storefront-smoke job below.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synarava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synarava_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synarava_ci
      APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version
        run: pnpm check:version

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Dependency security audit
        run: pnpm audit --audit-level high --prod

      - name: Push database schema
        run: pnpm prisma:push

      - name: Unit tests
        run: pnpm test:run

      - name: Build
        run: pnpm build

  storefront-smoke:
    name: Storefront smoke (desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: synarava_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synarava_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/synarava_ci
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:push
      # Build before smoke so Playwright starts `next start` (fast, deterministic)
      # instead of cold `next dev`, which often exceeds the 120s webServer timeout on GHA.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test e2e/smoke.spec.ts --project=chromium --project=mobile-webkit-smoke
