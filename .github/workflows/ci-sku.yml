name: CI SKU

# Path-scoped SKU platform checks. Shop storefront smoke lives in ci.yml.
on:
  pull_request:
    paths:
      - "services/sku-api/**"
      - "packages/sku-core/**"
      - "packages/sku-contract/**"
      - "lib/sku/**"
      - ".railway/**"
      - "deploy/n8n/**"
      - "docs/adr/0004-portable-sku-service-boundary.md"
      - "docs/proposals/portable-sku-service.md"
      - "docs/runbooks/sku-*.md"
      - "docs/runbooks/portable-sku-platform-railway.md"
      - "docs/wiki/portable-sku-service.md"
      - "docs/testing/portable-sku-staging-matrix.md"
      - ".github/workflows/ci-sku.yml"
  push:
    # Feature/bot branches are covered by pull_request only — avoid double runs.
    branches:
      - main
      - staging
    paths:
      - "services/sku-api/**"
      - "packages/sku-core/**"
      - "packages/sku-contract/**"
      - "lib/sku/**"
      - ".railway/**"
      - "deploy/n8n/**"
      - "docs/adr/0004-portable-sku-service-boundary.md"
      - "docs/proposals/portable-sku-service.md"
      - "docs/runbooks/sku-*.md"
      - "docs/runbooks/portable-sku-platform-railway.md"
      - "docs/wiki/portable-sku-service.md"
      - "docs/testing/portable-sku-staging-matrix.md"
      - ".github/workflows/ci-sku.yml"

concurrency:
  # PRs: one in-flight run per PR (cancel superseded).
  # Pushes: per-commit group so a newer push cannot cancel an older queued run.
  group: ci-sku-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sku-quality:
    name: SKU Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      # GitHub Packages (@synarava/wiring-engine, shell-kit). See deploy.md.
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Auth GitHub Packages (@synarava)
        run: node scripts/ensure-github-packages-auth.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SKU unit tests
        run: pnpm test:sku

      - name: SKU API typecheck
        run: pnpm --filter @synarava/sku-api typecheck

      - name: SKU workflow contract
        run: pnpm exec vitest run lib/sku/__tests__/n8n-catalog-audit-workflow.test.ts
