packages:
  - "packages/*"
  - "services/*"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  core-js-pure: true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAgeExclude:
  - railway@3.15.0
overrides:
  browserslist: 4.28.9
  deepmerge-ts: 8.0.2
  sharp: 0.35.5
  source-map-js: 1.2.2
  # Keep Quality Gates prod audit green for Sentry transitive highs.
  # Do not globally force brace-expansion@5 — eslint's minimatch@3 needs brace-expansion@1.
  "minimatch@>=9>brace-expansion": ">=5.0.11"
  fast-uri: ">=3.1.7"
  nanoid: ">=3.3.18"
  postcss: ">=8.5.18"
