services:
  postgres:
    image: postgres:16-alpine
    container_name: synarava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synarava
      POSTGRES_USER: synarava
      POSTGRES_PASSWORD: synarava
    ports:
      - "55432:5432"
    volumes:
      - synarava-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synarava -d synarava"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: synarava-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: synarava-local
      MINIO_ROOT_PASSWORD: synarava-local-storage
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - synarava-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 synarava-local synarava-local-storage;
      mc mb --ignore-existing local/synarava-media;
      "

volumes:
  synarava-postgres-data:
  synarava-minio-data:
