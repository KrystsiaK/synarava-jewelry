<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin topbar chrome fixture</title>
  <style>
    /* Mirrors the admin topbar height contract from app/globals.css */
    :root {
      --adm-topbar-height: 4.25rem;
      --adm-bg: #f2f1ee;
      --adm-bg-soft: #e9e7e2;
      --adm-ink: #211d19;
      --adm-muted: #675e55;
      --adm-border: rgba(66, 55, 42, 0.18);
      --adm-accent: #7b5b1c;
      --adm-danger: #b42318;
      --adm-inset-x: 16px;
      --font-sans: system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--adm-bg); color: var(--adm-ink); font-family: var(--font-sans); }

    .admin-terminal {
      display: grid;
      grid-template-rows: var(--adm-topbar-height) minmax(0, 1fr);
      min-height: 100dvh;
      height: 100dvh;
      max-width: 100%;
      overflow: hidden;
    }

    .adm-topbar {
      position: relative;
      z-index: 120;
      box-sizing: border-box;
      height: var(--adm-topbar-height);
      min-height: var(--adm-topbar-height);
      max-height: var(--adm-topbar-height);
      overflow: clip;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-inline: var(--adm-inset-x);
      border-bottom: 1px solid var(--adm-border);
      background: color-mix(in srgb, var(--adm-bg-soft) 92%, transparent);
    }

    .adm-brand-kicker {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--adm-muted);
      white-space: nowrap;
    }

    .adm-sync-signal {
      --adm-sync-color: var(--adm-danger);
      display: inline-flex;
      align-items: stretch;
      min-width: 0;
      max-width: min(22rem, 46vw);
      height: 2.75rem;
      max-height: 100%;
      border: 1px solid color-mix(in srgb, var(--adm-sync-color) 38%, var(--adm-border));
      border-radius: 10px;
      background: color-mix(in srgb, var(--adm-sync-color) 8%, transparent);
      color: color-mix(in srgb, var(--adm-sync-color) 84%, var(--adm-ink));
      overflow: hidden;
    }

    .adm-sync-signal__link,
    .adm-sync-signal__refresh {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 2.75rem;
      min-height: 2.75rem;
      color: inherit;
      border: 0;
      background: transparent;
    }

    .adm-sync-signal__link {
      gap: 0.48rem;
      padding: 0 0.72rem;
      font-size: 0.68rem;
      font-weight: 780;
      line-height: 1;
      letter-spacing: 0.035em;
      white-space: nowrap;
    }

    .adm-sync-signal__refresh {
      border-left: 1px solid color-mix(in srgb, var(--adm-sync-color) 30%, var(--adm-border));
    }

    .adm-sync-signal__dot {
      width: 0.46rem;
      height: 0.46rem;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--adm-sync-color);
    }

    /* Regression probe: intentional tall child must not paint over the title */
    .adm-topbar-probe-tall {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-10%);
      width: 12rem;
      height: 6rem;
      background: rgba(180, 35, 24, 0.35);
      pointer-events: none;
    }

    .admin-content {
      min-height: 0;
      overflow: auto;
      padding: 1.25rem 1rem;
    }

    .adm-page-title {
      margin: 0;
      color: var(--adm-ink);
      font-size: clamp(1.9rem, 3vw, 2.55rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .adm-page-subtitle {
      margin-top: 0.75rem;
      max-width: 62ch;
      color: var(--adm-muted);
      font-size: 0.92rem;
      line-height: 1.65;
    }

    @media (max-width: 40rem) {
      .adm-sync-signal__label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .adm-sync-signal__link { padding: 0; }
    }

    html[data-theme="dark"] {
      --adm-bg: #090807;
      --adm-bg-soft: #0f0d0c;
      --adm-ink: #f4efe7;
      --adm-muted: #b8aea1;
      --adm-border: rgba(214, 190, 150, 0.18);
      --adm-accent: #d8b66a;
      --adm-danger: #f97066;
    }
  </style>
</head>
<body>
  <div class="admin-terminal" data-fixture="admin-topbar">
    <header class="adm-topbar" data-testid="adm-topbar">
      <div class="min-w-0" style="display:flex;align-items:center;gap:0.75rem;min-width:0">
        <span class="adm-brand-kicker">Admin console</span>
      </div>
      <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0">
        <div
          class="adm-sync-signal"
          data-state="failed"
          data-testid="adm-sync-signal"
          title="Missing Shopify permission: read_markets. Enable the scope in the Shopify app and reconnect."
        >
          <button type="button" class="adm-sync-signal__link" aria-label="Check failed. Missing Shopify permission: read_markets. Retry check.">
            <span class="adm-sync-signal__dot" aria-hidden="true"></span>
            <span class="adm-sync-signal__label">Check failed</span>
          </button>
          <button type="button" class="adm-sync-signal__refresh" aria-label="Check Shopify sync now">↻</button>
        </div>
        <!-- Optional probe toggled by tests to prove overflow:clip containment -->
        <div class="adm-topbar-probe-tall" data-testid="topbar-tall-probe" hidden></div>
      </div>
    </header>
    <main class="admin-content">
      <h1 class="adm-page-title" data-testid="page-title">Marketing</h1>
      <p class="adm-page-subtitle">Fixture page title used to detect topbar paint overlap.</p>
    </main>
  </div>
</body>
</html>
