# Railway service: sku-api (staging/production isolated SKU_DATABASE_URL)
# Watch paths should include services/sku-api, packages/sku-core, packages/sku-contract.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @synarava/sku-api prisma:generate && pnpm --filter @synarava/sku-api build"

[deploy]
startCommand = "pnpm --filter @synarava/sku-api prisma:deploy && pnpm --filter @synarava/sku-api start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
