# Railway service: sku-api
# Full staging checklist: docs/runbooks/sku-api-railway-staging.md
#
# Service root: monorepo repository root (pnpm workspace).
# Config-as-code path: services/sku-api/railway.toml
# Watch paths: services/sku-api/**, packages/sku-core/**, packages/sku-contract/**,
#              pnpm-lock.yaml, pnpm-workspace.yaml, package.json
# Required env: SKU_DATABASE_URL, SKU_API_CREDENTIALS
# Health: GET /health (ready only when credentials + DB)

[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @synarava/sku-api prisma:generate && pnpm --filter @synarava/sku-api build"

[deploy]
startCommand = "pnpm --filter @synarava/sku-api prisma:deploy && pnpm --filter @synarava/sku-api start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
